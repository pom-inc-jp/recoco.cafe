<!-- 写真の拡大表示（ギャラリー・撮影ページ）。動きは recoco.js -->
<dialog class="lightbox" aria-label="写真の拡大表示">
  <img src="data:," alt="">
  <p class="lb-cap"></p>
  <button type="button" class="round lb-close" aria-label="閉じる">{{{ic.close}}}</button>
  <button type="button" class="round lb-prev" aria-label="前の写真">{{{ic.prev}}}</button>
  <button type="button" class="round lb-next" aria-label="次の写真">{{{ic.next}}}</button>
</dialog>
